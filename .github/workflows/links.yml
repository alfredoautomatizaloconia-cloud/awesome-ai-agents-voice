name: Link Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --cache --max-cache-age 1d --timeout 20 README.md CONTRIBUTING.md
          fail: true
